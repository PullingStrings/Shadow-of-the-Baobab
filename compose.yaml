services:
  game:
    build: .
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - dependencies:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    init: true
  browser-tests:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    profiles: [test]
    working_dir: /app
    volumes:
      - .:/app
      - browser-dependencies:/app/node_modules
    environment:
      BASE_URL: http://game:5173
    depends_on:
      - game
    command: sh -c "npm ci && npm run test:e2e"
    init: true
volumes:
  dependencies:
  browser-dependencies:
